<main class="login-page">
  <div class="login-container">
    <!-- Illustration -->
    <div class="login-illustration">
      <img src="/images/bg-login.svg" alt="Login illustration" />
    </div>
    <div class="login-card">
      <header class="login-header">
        <h1 class="login-header__title">Login Comercial</h1>
        <p class="login-header__subtitle">Olá, para entrar é preciso informar suas credenciais de acesso!</p>
      </header>

      <!-- Form -->
     <app-login-form/>
     
      <footer class="login-footer">
        Não possui uma conta?
        <a href="/auth/sign-up" class="login-footer__link">Entre em contato</a>
      </footer>
    </div>
  </div>
</main>
